    [660, 660, 880].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .22;
      o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.start(t); o.stop(t + .2);
    });
    setTimeout(() => ac.close(), 1200);
  } catch {}
}
async function holdWake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} }
function releaseWake() { try { wake && wake.release(); } catch {} wake = null; }
function renderFocus() {
  const root = $('#focus-root');
  clearInterval(focusTick); focusTick = null;
  if (!focus) { root.innerHTML = ''; document.title = 'Порядок'; releaseWake(); return; }
  const t = data.tasks[focus.taskId];
  const resting = focus.phase === 'break' || focus.phase === 'rested', ended = focus.phase === 'done' || focus.phase === 'rested';
  const title = resting ? 'Перерыв' : t ? t.title || 'Без названия' : 'Фокус';
  if (focusOpen) {
    root.innerHTML = `<div class="fov ${focus.phase === 'break' ? 'break' : ''} ${!focus.paused && !ended ? 'run' : ''}" role="dialog" aria-label="Таймер фокуса"><div class="fov-in">
      <div class="lbl">${focus.phase === 'done' ? 'Раунд завершён' : focus.phase === 'rested' ? 'Перерыв окончен' : focus.paused ? 'Пауза' : resting ? 'Перерыв' : 'Фокус'}</div>
      <div class="dial"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="45"/><circle class="fg" id="f-ring" cx="50" cy="50" r="45" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg><div class="tm" id="f-time"></div></div>
      <h2>${esc(title)}</h2>
      <div class="row">${ended
        ? `${focus.phase === 'done' ? `<button class="btn primary" data-action="focus-break">Перерыв 5 мин</button>` : ''}<button class="btn ${focus.phase === 'rested' ? 'primary' : ''}" data-action="focus-again">Ещё раунд</button>${t && !t.done ? `<button class="btn" data-action="focus-done">Задача выполнена</button>` : ''}<button class="btn" data-action="focus-close">Закрыть</button>`
        : `<button class="btn primary" data-action="focus-pause">${focus.paused ? 'Продолжить' : 'Пауза'}</button><button class="btn" data-action="focus-stop">Завершить</button><button class="btn" data-action="focus-min">Свернуть</button>`}</div>
      ${t && !resting && focusTotal(t) ? `<div class="rep-hint">Всего на эту задачу: ${fmtMin(focusTotal(t))}</div>` : ''}
    </div></div>`;
    holdWake();
  } else {
    root.innerHTML = `<button class="fpill" data-action="focus-max" aria-label="Открыть таймер"><svg viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="11"/><circle class="fg" id="f-ring" cx="14" cy="14" r="11" stroke-dasharray="69.12" stroke-dashoffset="0"/></svg><span class="tm" id="f-time"></span><span class="tt">${esc(title)}</span></button>`;
    releaseWake();
  }
  tickFocus();
  if (focus && !focus.paused) focusTick = setInterval(tickFocus, 1000);
}
function tickFocus() {
  if (!focus) return;
  const left = focusLeft();
  if (!focus.paused && left <= 0) { finishFocus(); return; }
  const ring = $('#f-ring'), tm = $('#f-time');
  if (ring) ring.style.strokeDashoffset = ((focusOpen ? 282.74 : 69.12) * (1 - left / (focus.dur * 60000))).toFixed(2);
  if (tm) tm.textContent = mmss(left);
  document.title = focus.paused ? 'Порядок' : `${mmss(left)} · Порядок`;
}
if (focus) { const boot = setInterval(() => { if (store.ready) { clearInterval(boot); renderFocus(); } }, 300); }

/* ---------- command palette ---------- */
const pal = {items: [], idx: 0};
function quickCreate(text) {
  const r = parseQuick(text); if (!r.title) return;
  const t = newTask({title: r.title, date: r.date || (r.time ? today() : null), time: r.time || null, deadline: r.deadline || null, priority: r.priority || 2, tags: r.tags});
  store.put('tasks', t, 0); flashTask(t.id); renderAll();
  toast(`Добавлено: ${t.date ? relDay(t.date).toLowerCase() : 'во входящие'}`);
}
function palItems(q) {
  const ql = q.trim().toLowerCase(), out = [];
  const add = (label, icon, fn, hint = '') => { if (!ql || label.toLowerCase().includes(ql)) out.push({label, icon, fn, hint}); };
  if (ql) {
    const r = parseQuick(q);
    if (r.title) out.push({label: `Создать задачу: «${r.title}»`, icon: 'plus', hint: r.date ? relDay(r.date).toLowerCase() : 'во входящие', fn: () => quickCreate(q)});
    tasks().filter(t => !t.done && (t.title || '').toLowerCase().includes(ql)).sort(byTask).slice(0, 6).forEach(t => out.push({label: t.title, icon: 'check', hint: t.date ? relDay(t.date).toLowerCase() : 'задача', fn: () => openSheet('tasks', t.id)}));
    notes().filter(n => (n.title + ' ' + n.body).toLowerCase().includes(ql)).slice(0, 4).forEach(n => out.push({label: n.title || 'Без названия', icon: 'note', hint: 'заметка', fn: () => { S.noteId = n.id; go('notes'); }}));
    events().filter(e => (e.title || '').toLowerCase().includes(ql)).slice(0, 4).forEach(e => out.push({label: e.title, icon: 'ev', hint: eventWhen(e), fn: () => openSheet('events', e.id)}));
  }
  Object.entries(VIEWS).forEach(([k, v]) => add(v.title, v.icon, () => go(k), 'раздел'));
  projects().forEach(p => add(p.name, 'folder', () => go('project', {id: p.id}), 'проект'));
  add('Новая задача', 'plus', () => createTask(contextDefaults()), TOUCH ? '' : 'N');
  add('Новое событие', 'ev', () => createEvent({date: today()}));
  add('Новая заметка', 'note', () => createNote({}));
  add('Добавить в расписание', 'sched', () => createSeries());
  const first = tasks().filter(t => !t.done && t.date === today()).sort(byTask)[0];
  if (first && !focus) add(`Фокус 25 минут: ${first.title}`, 'clock', () => startFocus(first.id, 25));
  [['light', 'Светлая тема'], ['dark', 'Тёмная тема'], ['auto', 'Тема как в системе']].forEach(([k, l]) => add(l, 'star', () => { lsSet('poryadok:theme', k); applyTheme(k); renderSidebar(); }));
  add('Скачать копию данных', 'folder', () => exportData());
  return out.slice(0, 40);
}
function renderPal(q, keep) {
  if (!keep) pal.items = palItems(q);
  $('#pal-list').innerHTML = pal.items.length
    ? pal.items.map((it, i) => `<button class="pal-item ${i === pal.idx ? 'on' : ''}" data-pi="${i}">${ic(it.icon)}<span class="t">${esc(it.label)}</span><span class="k">${esc(it.hint || '')}</span></button>`).join('')
    : `<div class="pal-empty">Ничего не найдено.</div>`;
  $('#pal-list .on')?.scrollIntoView({block: 'nearest'});
}
function openPal() {
  if ($('#pal')) return;
  closeMenu();
  $('#pal-root').innerHTML = `<div class="pal" id="pal"><div class="pal-box" role="dialog" aria-label="Команды"><input id="pal-q" placeholder="Команда, раздел или новая задача" autocomplete="off" aria-label="Команда или поиск"><div class="pal-list" id="pal-list"></div></div></div>`;
  pal.idx = 0; renderPal('');
  const q = $('#pal-q'); q.focus();
  q.addEventListener('input', () => { pal.idx = 0; renderPal(q.value); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = pal.items.length || 1; pal.idx = (pal.idx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; renderPal(q.value, true); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(pal.idx); }
  });
  $('#pal').addEventListener('click', e => { const b = e.target.closest('[data-pi]'); if (b) runPal(+b.dataset.pi); else if (!e.target.closest('.pal-box')) closePal(); });
}
function runPal(i) { const it = pal.items[i]; closePal(); if (it) it.fn(); }
function closePal() { $('#pal-root').innerHTML = ''; }

/* ---------- task quick menu (right click / long press) and swipes ---------- */
function moveTask(t, d, msg) {
  const prev = {date: t.date, time: t.time, repeat: t.repeat};
  t.date = d; if (!d) { t.time = null; t.repeat = null; }
  store.put('tasks', t, 0); renderAll();
  toast(msg, () => { Object.assign(t, prev); store.put('tasks', t, 0); renderAll(); });
}
function taskMenu(id, x, y) {
  const t = data.tasks[id]; if (!t) return;
  const td = today();
  showMenu(x, y, t.title || 'Задача', [
    {label: 'Сегодня', icon: 'star', fn: () => moveTask(t, td, 'Перенесено на сегодня')},
    {label: 'Завтра', icon: 'up', fn: () => moveTask(t, addDays(td, 1), 'Перенесено на завтра')},
    {label: 'Через неделю', icon: 'cal', fn: () => moveTask(t, addDays(td, 7), 'Перенесено на неделю вперёд')},
    {label: 'Убрать дату', icon: 'inbox', fn: () => moveTask(t, null, 'Дата убрана')},
    {label: t.priority === 1 ? 'Обычная важность' : 'Высокая важность', icon: 'flag', fn: () => { t.priority = t.priority === 1 ? 2 : 1; store.put('tasks', t, 0); renderAll(); }},
    ...(t.done ? [] : [{label: 'Фокус 25 минут', icon: 'clock', fn: () => startFocus(id, 25)}]),
    {label: 'Удалить', icon: 'x', fn: () => { store.del('tasks', id); renderAll(); toast('Задача удалена', () => { store.put('tasks', t, 0); renderAll(); }); }},
  ]);
}
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('.task[data-open]'); if (!row) return;
  e.preventDefault(); taskMenu(row.dataset.open.split(':')[1], e.clientX, e.clientY);
});
let sw = null;
document.addEventListener('touchstart', e => {
  const row = e.target.closest('#view .task[data-open]');
  if (!row || e.touches.length !== 1 || e.target.closest('.check')) { sw = null; return; }
  const p = e.touches[0], id = row.dataset.open.split(':')[1];
  sw = {row, id, x: p.clientX, y: p.clientY, dx: 0, mode: null};
  sw.lp = setTimeout(() => { if (sw && sw.id === id && !sw.mode) { sw.mode = 'menu'; suppressClick = Date.now(); taskMenu(id, p.clientX, p.clientY); } }, 520);
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!sw || sw.mode === 'menu') return;
  const p = e.touches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y;
  if (!sw.mode) {
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) { sw.mode = 'swipe'; clearTimeout(sw.lp); sw.row.classList.add('swiping'); }
    else if (Math.abs(dy) > 10 || Math.abs(dx) > 12) { clearTimeout(sw.lp); sw = null; return; }
    else return;
  }
  e.preventDefault();
  sw.dx = dx; sw.row.style.transform = `translateX(${dx}px)`;
  sw.row.dataset.swipe = dx > 0 ? 'done' : 'later';
  sw.row.classList.toggle('armed', Math.abs(dx) > 84);
}, {passive: false});
const endSwipe = () => {
  if (!sw) return;
  clearTimeout(sw.lp);
  const {row, id, dx, mode} = sw; sw = null;
  if (mode === 'menu') { suppressClick = Date.now(); return; }
  if (mode !== 'swipe') return;
  suppressClick = Date.now();
  row.classList.remove('swiping', 'armed'); row.classList.add('snap'); row.style.transform = '';
  setTimeout(() => { row.classList.remove('snap'); delete row.dataset.swipe; }, 260);
  const t = data.tasks[id]; if (!t || Math.abs(dx) <= 84) return;
  if (dx > 0) toggleTask(id); else moveTask(t, addDays(today(), 1), 'Перенесено на завтра');
};
document.addEventListener('touchend', endSwipe);
document.addEventListener('touchcancel', endSwipe);

/* keep "today" honest across midnight */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } else if (S.view === 'calendar' && S.cal.mode === 'week') { const nl = $('.now-line'); if (nl) { const n = new Date(); nl.style.top = (n.getHours() * 60 + n.getMinutes()) / 60 * 48 + 'px'; } } }, 60000);
window.addEventListener('resize', (() => { let w = narrow(); return () => { const n = narrow(); if (n !== w) { w = n; renderView(); } }; })());

renderAll();
store.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
